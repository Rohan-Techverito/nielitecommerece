<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cart.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/topStyle.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8f9fa, #dee2e6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 720px;
            width: 100%;
        }

        h2 {
            color: #343a40;
            margin-bottom: 15px;
        }

        .total-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            font-size: 1.3em;
            font-weight: bold;
            color: #212529;
            margin-bottom: 20px;
        }

        .pay-button {
            display: inline-block;
            padding: 14px;
            width: 100%;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            font-size: 1.2em;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .pay-button:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #0056b3, #003d80);
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            .pay-button {
                font-size: 1em;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Checkout</h2>
    {% if items %}
    <table class="checkout-lines">
        <thead>
            <tr>
                <th>Product</th>
                <th>Unit Price</th>
                <th>Quantity</th>
                <th>Line Total</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.name }}</td>
                <td>Rs {{ item.price }}</td>
                <td>{{ item.quantity }}</td>
                <td>Rs {{ item.line_total }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>Your cart is empty.</p>
    {% endif %}
    <div class="total-box">
        Total Amount: Rs {{ totalPrice }}
    </div>
    <form action="{{ url_for('saveorder') }}" method="post">
        <button type="submit" class="pay-button">Proceed to Pay</button>
    </form>
</div>

</body>
</html>
