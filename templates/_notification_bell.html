{% if unreadNotificationCount is defined and unreadNotificationCount is not none %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/notifications.css') }}">
<div class="notification-bell" id="notificationBell" data-unread-count="{{ unreadNotificationCount or 0 }}">
  <button type="button" class="notification-bell-button" id="notificationBellButton"
          aria-label="Notifications" title="Notifications"
          aria-haspopup="true" aria-expanded="false" aria-controls="notificationDropdown">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    <span class="notification-badge{% if not unreadNotificationCount %} notification-badge-hidden{% endif %}"
          id="notificationBadge" data-count="{{ unreadNotificationCount or 0 }}"
          aria-live="polite"{% if not unreadNotificationCount %} hidden{% endif %}>{{ unreadNotificationCount or 0 }}</span>
  </button>
  <div class="notification-dropdown" id="notificationDropdown" hidden>
    <div class="notification-dropdown-header">Notifications</div>
    <div class="notification-list" id="notificationList">
      <p class="notification-loading">Loading notifications...</p>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
{% endif %}
